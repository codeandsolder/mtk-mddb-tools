[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mtk-mddb-tools"
version = "0.2.0"
description = "Extract and search MediaTek Catcher/META MDDB .EDB modem databases"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "codeandsolder" }]
dependencies = [
  "rocksdict>=0.3.29",
]

[project.scripts]
mtk-mddb-extract = "mtk_mddb.cli:extract_main"
mtk-mddb-query = "mtk_mddb.cli:query_main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.17.2",
  "ty>=0.0.92",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mtk_mddb"]
