name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
  GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build

  ghidra-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: .cache/ghidra_12.2_PUBLIC
          key: ghidra-12.2-public-20261016
      - if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$GHIDRA_URL" -o "$GHIDRA_ZIP"
          echo "$GHIDRA_SHA256  $GHIDRA_ZIP" | sha256sum -c -
          unzip -q "$GHIDRA_ZIP"
          mkdir -p .cache
          mv ghidra_12.2_PUBLIC .cache/ghidra_12.2_PUBLIC
          rm "$GHIDRA_ZIP"
      - name: Run Java parser tests
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/.cache/ghidra_12.2_PUBLIC
        run: ./gradlew test --no-daemon -ProcksdbPlatform=linux64
      - name: Compile and package extension
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/.cache/ghidra_12.2_PUBLIC
        run: ./scripts/build_ghidra_extension.sh linux64
      - uses: actions/upload-artifact@v7
        with:
          name: ghidra-extension-linux64
          path: dist/mtk-mddb-tools-ghidra-12.2-linux64.zip
          if-no-files-found: error
