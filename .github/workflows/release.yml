name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
  GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: latest-known
          enable-cache: true
      - id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: .cache/ghidra_12.2_PUBLIC
          key: ghidra-12.2-public-20261016
      - if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$GHIDRA_URL" -o "$GHIDRA_ZIP"
          echo "$GHIDRA_SHA256  $GHIDRA_ZIP" | sha256sum -c -
          unzip -q "$GHIDRA_ZIP"
          mkdir -p .cache
          mv ghidra_12.2_PUBLIC .cache/ghidra_12.2_PUBLIC
          rm "$GHIDRA_ZIP"
      - name: Build Python package
        run: uv build
      - name: Run Java parser tests
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/.cache/ghidra_12.2_PUBLIC
        run: ./gradlew test --no-daemon -ProcksdbPlatform=linux64
      - name: Build Ghidra platform artifacts
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/.cache/ghidra_12.2_PUBLIC
        run: ./scripts/build_ghidra_extension.sh linux64 win64 osx
      - name: Generate checksums
        run: |
          cd dist
          sha256sum mtk_mddb_tools-*.whl mtk_mddb_tools-*.tar.gz mtk-mddb-tools-ghidra-12.2-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/mtk_mddb_tools-*.whl
            dist/mtk_mddb_tools-*.tar.gz
            dist/mtk-mddb-tools-ghidra-12.2-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
