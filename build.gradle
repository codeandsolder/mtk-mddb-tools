def ghidraInstallDir
if (System.env.GHIDRA_INSTALL_DIR) {
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
} else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
if (!ghidraInstallDir) {
    throw new GradleException("GHIDRA_INSTALL_DIR is not defined")
}
apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"

repositories { mavenCentral() }

def detectRocksPlatform = {
    def os = System.getProperty("os.name").toLowerCase()
    if (os.contains("win")) return "win64"
    if (os.contains("mac") || os.contains("darwin")) return "osx"
    return "linux64"
}
def rocksPlatform = project.findProperty("rocksdbPlatform") ?: System.getenv("ROCKSDB_PLATFORM") ?: detectRocksPlatform()

dependencies {
    implementation "org.tukaani:xz:1.10"
    implementation "org.rocksdb:rocksdbjni:11.1.1:${rocksPlatform}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

test {
    useJUnitPlatform()
}

for (pattern in [
    ".git/**", ".github/**", ".gradle/**", ".cache/**", ".venv/**", ".pytest_cache/**", ".ruff_cache/**",
    "dist/**", "tests/**", "src/test/**", "src/mtk_mddb/**", "pyproject.toml", "uv.lock",
    "gradle/**", "gradlew", "gradlew.bat"
]) {
    buildExtension.exclude pattern
}

// Ghidra scripts are source-loaded at runtime and are not part of the extension main source set.
// Compile them explicitly so API drift and syntax errors fail CI before a release is packaged.
tasks.register("compileGhidraScripts", JavaCompile) {
    source = fileTree("ghidra_scripts") { include "**/*.java" }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir("ghidra-script-classes")
    options.encoding = "UTF-8"
}

tasks.named("check") { dependsOn "compileGhidraScripts" }
tasks.named("buildExtension") {
    dependsOn "compileGhidraScripts"
    // Ghidra caches compiled ghidra_scripts by source path/mtime. Gradle's reproducible
    // ZIP timestamp (1980) can therefore leave stale script bytecode after an in-place
    // extension upgrade. Preserve source mtimes so changed scripts are recompiled.
    preserveFileTimestamps = true
}
